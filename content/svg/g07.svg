<svg viewBox="0 0 560 380" role="img" aria-label="덮개를 연 벽 콘센트 그림. 갈색 선은 왼쪽 나사에, 파랑 선은 오른쪽 나사에, 초록노랑 선은 가운데 접지 나사에 연결되어 있다" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="wb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e4e7e5"/><stop offset="1" stop-color="#cfd5d2"/></linearGradient>
<linearGradient id="ob" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9ecea"/></linearGradient>
<radialGradient id="rc" cx=".5" cy=".4" r=".6"><stop offset="0" stop-color="#f7f8f7"/><stop offset="1" stop-color="#dde1df"/></radialGradient>
<radialGradient id="sc" cx=".35" cy=".35" r=".7"><stop offset="0" stop-color="#f3d58a"/><stop offset="1" stop-color="#b8862c"/></radialGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".18"/></filter>
</defs>
<rect width="560" height="380" rx="16" fill="#eef1f0"/>
<!-- wall box -->
<rect x="130" y="24" width="260" height="290" rx="20" fill="url(#wb)" stroke="#b7bfbb" stroke-width="2"/>
<rect x="146" y="40" width="228" height="258" rx="14" fill="#c4cbc7"/>
<!-- outlet body -->
<g filter="url(#sh)">
<rect x="166" y="52" width="188" height="186" rx="16" fill="url(#ob)" stroke="#c9cfcc" stroke-width="1.5"/>
<circle cx="260" cy="145" r="70" fill="url(#rc)" stroke="#c6ccc9" stroke-width="2"/>
<circle cx="234" cy="145" r="10" fill="#3a3f3d"/><circle cx="286" cy="145" r="10" fill="#3a3f3d"/>
<rect x="248" y="70" width="24" height="12" rx="3" fill="url(#sc)"/><rect x="248" y="208" width="24" height="12" rx="3" fill="url(#sc)"/>
</g>
<!-- terminals -->
<g>
<rect x="176" y="246" width="168" height="34" rx="8" fill="#f4f5f4" stroke="#c9cfcc"/>
<circle cx="200" cy="263" r="11" fill="url(#sc)"/><path d="M193 263h14M200 256v14" stroke="#7a5a1c" stroke-width="2.5"/>
<circle cx="260" cy="263" r="11" fill="url(#sc)"/><path d="M253 263h14M260 256v14" stroke="#7a5a1c" stroke-width="2.5"/>
<circle cx="320" cy="263" r="11" fill="url(#sc)"/><path d="M313 263h14M320 256v14" stroke="#7a5a1c" stroke-width="2.5"/>
</g>
<!-- wires -->
<path d="M150 380 C150 330 200 320 200 276" stroke="#7b4a22" stroke-width="15" fill="none" stroke-linecap="round"/>
<path d="M150 380 C150 330 200 320 200 276" stroke="#a5683a" stroke-width="6" fill="none" stroke-linecap="round" opacity=".55"/>
<path d="M370 380 C370 330 320 320 320 276" stroke="#1f5fbf" stroke-width="15" fill="none" stroke-linecap="round"/>
<path d="M370 380 C370 330 320 320 320 276" stroke="#5d92e0" stroke-width="6" fill="none" stroke-linecap="round" opacity=".55"/>
<path d="M260 380 V276" stroke="#e7c62b" stroke-width="15" fill="none" stroke-linecap="butt"/>
<path d="M260 380 V276" stroke="#2c9a4b" stroke-width="15" fill="none" stroke-dasharray="11 11"/>
<!-- labels -->
<g font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="900" font-size="15" fill="#1d2623">
<path d="M150 340 H122" stroke="#7b4a22" stroke-width="2"/><circle cx="150" cy="340" r="4" fill="#7b4a22"/>
<text x="16" y="322">갈색</text><text x="16" y="342" font-size="12.5" font-weight="700" fill="#5d6a66">가는 길 · 위험</text>
<path d="M370 340 H448" stroke="#1f5fbf" stroke-width="2"/><circle cx="370" cy="340" r="4" fill="#1f5fbf"/>
<text x="456" y="322">파랑</text><text x="456" y="342" font-size="12.5" font-weight="700" fill="#5d6a66">돌아오는 길</text>
<path d="M268 290 H398" stroke="#2c9a4b" stroke-width="2"/><circle cx="268" cy="290" r="4" fill="#2c9a4b"/>
<text x="404" y="270">초록노랑</text><text x="404" y="290" font-size="12.5" font-weight="700" fill="#5d6a66">안전선 (접지)</text>
<path d="M248 76 H164" stroke="#b8862c" stroke-width="2"/><circle cx="248" cy="76" r="4" fill="#b8862c"/>
<text x="16" y="70" font-size="13">접지 클립</text><text x="16" y="88" font-size="12" font-weight="700" fill="#5d6a66">초록노랑 선과 이어져요</text>
</g>
</svg>
