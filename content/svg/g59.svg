<svg viewBox="0 0 560 270" role="img" aria-label="사람이 감전됐을 때 세 단계: 차단기를 내리고, 전기를 못 끊으면 마른 나무 막대로 떼어 내고, 119에 신고한다. 맨손으로 만지면 안 된다" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="e59-wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c8935a"/><stop offset="1" stop-color="#a8733e"/></linearGradient>
