<g text-anchor="middle">
<text x="100" y="208" font-size="15" font-weight="900" fill="#1d2623">① 전기부터 끊기</text>
<text x="100" y="228" font-size="12" font-weight="700" fill="#5d6a66">차단기 내리기 (모르면 큰 것)</text>
<text x="100" y="246" font-size="12" font-weight="700" fill="#5d6a66">또는 플러그 뽑기</text>
<text x="280" y="208" font-size="15" font-weight="900" fill="#1d2623">② 못 끊으면 마른 막대로</text>
<text x="280" y="228" font-size="12" font-weight="700" fill="#5d6a66">나무·플라스틱으로 밀어내기</text>
<text x="280" y="246" font-size="12" font-weight="900" fill="#e0362c">맨손·젖은 것·쇠붙이 ✕</text>
