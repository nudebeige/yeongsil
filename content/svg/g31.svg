<text x="145" y="150" font-size="15" font-weight="900" fill="#1f5a4c">멀쩡한 퓨즈</text><text x="145" y="172" font-size="12.5" font-weight="700" fill="#5d6a66">가운데 가는 선이 이어져 있어요</text>
<text x="415" y="150" font-size="15" font-weight="900" fill="#c73a2e">끊어진 퓨즈</text><text x="415" y="172" font-size="12.5" font-weight="700" fill="#5d6a66">선이 끊기고 안이 거뭇해요 → 같은 A로 교체</text>
