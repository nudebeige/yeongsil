<svg viewBox="0 0 560 200" role="img" aria-label="유리관 퓨즈 두 개: 왼쪽은 가운데 선이 이어진 멀쩡한 퓨즈, 오른쪽은 선이 끊어지고 안쪽이 그을린 퓨즈" xmlns="http://www.w3.org/2000/svg">
