<radialGradient id="fz-soot" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#4a3a2a" stop-opacity=".75"/><stop offset="1" stop-color="#4a3a2a" stop-opacity="0"/></radialGradient></defs>
