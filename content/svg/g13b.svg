<svg viewBox="0 0 560 230" role="img" aria-label="멀티테스터 아래쪽 단자 세 개: 검은 선은 COM, 빨간 선은 V옴 단자에 꽂고, 10A 단자는 집에서 쓰지 않는다" xmlns="http://www.w3.org/2000/svg">
<rect width="560" height="230" rx="16" fill="#eef1f0"/>
<g font-family="Noto Sans KR, Malgun Gothic, sans-serif">
<rect x="40" y="30" width="300" height="90" rx="14" fill="#f2c230" stroke="#c99a12" stroke-width="2"/>
<g>
<circle cx="95" cy="75" r="20" fill="#2b2f2e"/><circle cx="95" cy="75" r="9" fill="#111"/>
<circle cx="190" cy="75" r="20" fill="#2b2f2e"/><circle cx="190" cy="75" r="9" fill="#111"/>
<circle cx="285" cy="75" r="20" fill="#2b2f2e"/><circle cx="285" cy="75" r="9" fill="#111"/>
</g>
<text x="95" y="48" text-anchor="middle" font-size="12" font-weight="900" fill="#c73a2e">10A</text>
<text x="190" y="48" text-anchor="middle" font-size="12" font-weight="900" fill="#1d2623">COM</text>
<text x="285" y="48" text-anchor="middle" font-size="12" font-weight="900" fill="#c73a2e">VΩ</text>
<path d="M190 95 C190 150 170 170 150 205" stroke="#1d2623" stroke-width="9" fill="none" stroke-linecap="round"/>
<path d="M285 95 C285 150 300 170 320 205" stroke="#d63a2f" stroke-width="9" fill="none" stroke-linecap="round"/>
<path d="M78 58 L112 92 M112 58 L78 92" stroke="#e0362c" stroke-width="5" stroke-linecap="round"/>
<text x="370" y="62" font-size="15" font-weight="900" fill="#1d2623">검은 선 → COM</text>
<text x="370" y="82" font-size="12.5" font-weight="700" fill="#5d6a66">어떤 측정이든 항상 여기</text>
<text x="370" y="118" font-size="15" font-weight="900" fill="#c73a2e">빨간 선 → VΩ</text>
<text x="370" y="138" font-size="12.5" font-weight="700" fill="#5d6a66">전압·저항·도통은 여기</text>
<text x="370" y="174" font-size="15" font-weight="900" fill="#c73a2e">10A·mA 단자는 쓰지 않기</text>
<text x="370" y="194" font-size="12.5" font-weight="700" fill="#5d6a66">여기 꽂고 콘센트에 대면 합선돼요</text>
</g>
</svg>
