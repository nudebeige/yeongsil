<path d="M150 320 C160 260 200 200 222 176" stroke="#7a4a2a" stroke-width="12" fill="none" stroke-linecap="round"/>
<path d="M410 320 C400 260 360 200 338 176" stroke="#2f6fc4" stroke-width="12" fill="none" stroke-linecap="round"/>
<path d="M280 320 C280 250 280 170 280 116" stroke="url(#s20-gy)" stroke-width="12" fill="none" stroke-linecap="round"/>

<!-- 이름표 -->
<g font-size="14" font-weight="900">
  <circle cx="120" cy="196" r="13" fill="#1f5e4b"/><text x="120" y="201" fill="#fff" text-anchor="middle" font-size="13">1</text>
  <text x="104" y="226" fill="#7a4a2a" text-anchor="end">갈색</text>
  <circle cx="440" cy="196" r="13" fill="#1f5e4b"/><text x="440" y="201" fill="#fff" text-anchor="middle" font-size="13">3</text>
  <text x="456" y="226" fill="#2f6fc4">파랑</text>
  <circle cx="340" cy="76" r="13" fill="#1f5e4b"/><text x="340" y="81" fill="#fff" text-anchor="middle" font-size="13">2</text>
