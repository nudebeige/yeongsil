</g>
<path d="M133 196 L208 166" stroke="#1f5e4b" stroke-width="1.5" stroke-dasharray="4 3"/>
<path d="M427 196 L352 166" stroke="#1f5e4b" stroke-width="1.5" stroke-dasharray="4 3"/>
