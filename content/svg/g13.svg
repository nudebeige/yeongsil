<svg viewBox="0 0 560 280" role="img" aria-label="멀티테스터 다이얼: 물결 표시 V에 맞추면 콘센트 전압을 잴 수 있고, 저항이나 전류 칸에 두고 콘센트에 넣으면 위험하다" xmlns="http://www.w3.org/2000/svg">
<rect width="560" height="280" rx="16" fill="#eef1f0"/>
<g font-family="Noto Sans KR, Malgun Gothic, sans-serif">
<rect x="40" y="20" width="200" height="240" rx="22" fill="#f2c230" stroke="#c99a12" stroke-width="2"/>
<rect x="62" y="38" width="156" height="56" rx="8" fill="#c9d6c2" stroke="#7d8a78" stroke-width="2"/>
<text x="140" y="78" text-anchor="middle" font-family="Consolas, monospace" font-size="34" font-weight="700" fill="#1d2623">221.4</text>
