<text x="92" y="118">V~</text><text x="140" y="104" fill="#9aa19e">OFF</text><text x="190" y="118" fill="#9aa19e">V=</text><text x="210" y="180" fill="#9aa19e">Ω</text><text x="186" y="236" fill="#9aa19e">A</text></g>
<circle cx="92" cy="113" r="16" fill="none" stroke="#2fd17a" stroke-width="3"/>
<path d="M260 96 H300" stroke="#2c9a4b" stroke-width="3"/><circle cx="260" cy="96" r="5" fill="#2c9a4b"/>
<text x="310" y="92" font-size="16" font-weight="900" fill="#1f5a4c">V~ (물결 V) 에 맞춰요</text>
<text x="310" y="114" font-size="12.5" font-weight="700" fill="#5d6a66">콘센트 전기를 재는 칸이에요</text>
<text x="310" y="134" font-size="12.5" font-weight="700" fill="#5d6a66">200~230이 나오면 정상</text>
