<text x="310" y="214" font-size="12.5" font-weight="700" fill="#5d6a66">이 칸에 둔 채 콘센트에 넣으면</text>
<text x="310" y="234" font-size="12.5" font-weight="700" fill="#5d6a66">불꽃이 튀거나 테스터가 망가져요</text>
